<style>

:root[data-theme="dark"]{--bg:#14171b;--sf:#1d2126;--tx:#e9ebee;--mu:#9ba3ac;--bd:#2f353c;--pr:#ff6b70;--pb:#3a1517;--on:#1a0507;--rd:#f09595;--rb:#501313;--gn:#5dcaa5;--gb:#0f3a31;--am:#fac775;--ab:#412402}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:var(--tx);background:var(--sf);border:1px solid var(--bd);border-radius:8px;padding:8px 11px;max-width:100%;box-sizing:border-box}
button{cursor:pointer}button:hover{border-color:var(--pr)}button.p{background:var(--pr);color:var(--on);border-color:var(--pr);font-weight:600}button.s{padding:4px 10px;font-size:13px}
a{color:var(--pr);text-decoration:none}:focus-visible{outline:2px solid var(--pr);outline-offset:2px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--sf);border-bottom:1px solid var(--bd);padding:8px 14px}
.logo{height:36px;background:#fff;border-radius:6px;padding:3px 6px}.dh{position:sticky;top:0;background:var(--sf);z-index:2;padding:6px 0;border-bottom:1px solid var(--bd)}.hr{display:flex;gap:8px;align-items:center;flex-wrap:wrap}header b{font-size:16px}
#nv{display:flex;gap:2px;overflow-x:auto;margin-top:6px}#nv button{border:0;background:none;color:var(--mu);font-weight:500;white-space:nowrap}#nv button.on{background:var(--pb);color:var(--pr)}
main{max-width:900px;margin:0 auto;padding:16px 14px 60px}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--mu);margin:22px 0 8px;font-weight:600}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:12px 14px;margin:8px 0}
.it{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.it .g{flex:1;min-width:160px;cursor:pointer}
.sp{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mu{color:var(--mu);font-size:13px}.tag{display:inline-block;padding:1px 9px;border-radius:10px;font-size:12px;background:var(--pb);color:var(--pr)}.tag.r{background:var(--rb);color:var(--rd)}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(115px,1fr));gap:8px}.kp .card{margin:0;text-align:center}.kp b{display:block;font-size:24px;line-height:1.2}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.chips button.on,.stg button.on{background:var(--pr);color:var(--on);border-color:var(--pr)}
.bar{height:8px;background:var(--pb);border-radius:4px}.bar i{display:block;height:100%;background:var(--pr);border-radius:4px}
.br{display:grid;grid-template-columns:130px 1fr 44px;gap:8px;align-items:center;font-size:13px;margin:5px 0}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}.g2 .card{margin:0}
.lg{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;margin-top:6px}.lg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px}
#dw{position:fixed;inset:0 0 0 auto;width:min(480px,100%);background:var(--sf);border-left:1px solid var(--bd);padding:calc(14px + env(safe-area-inset-top,0px)) 14px calc(14px + env(safe-area-inset-bottom,0px));overflow:auto;transform:translateX(105%);transition:transform .15s;z-index:9}#dw.on{transform:none}
.f{display:block;margin:8px 0}.f span{display:block;font-size:12px;color:var(--mu)}.f input:not([type=checkbox]),.f select,.f textarea{width:100%}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stg{display:flex;gap:4px;flex-wrap:wrap;margin:8px 0}
.log div{padding:6px 0;border-bottom:1px solid var(--bd);font-size:13px}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:6px;border-bottom:1px solid var(--bd)}
pre{white-space:pre-wrap;font:13px/1.55 system-ui,sans-serif;margin:0}
.tl{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:6px 10px;border:1px solid var(--bd);border-radius:10px;font-size:13px}.tl div{display:flex;gap:4px;align-items:center}
#toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:8px 14px;border-radius:8px;display:none;z-index:20}
@media(prefers-reduced-motion:reduce){#dw{transition:none}}

<script>
const ST=[["New",0,"Contact the patient"],["Contacted",2,"Follow up if no reply"],["Docs requested",1,"Chase documents"],["Docs received",0,"Send to hospital"],["With hospital",3,"Chase hospital feedback"],["Plan received",0,"Share plan with patient"],["Quote sent",2,"Follow up on quote"],["Deciding",3,"Ask for a decision"],["Appt requested",2,"Check appointment status"],["Confirmed · Won",14,"Post-treatment check-in"],["Lost",null,""]];
const WON=9,LOST=10,SA={3:"docs",5:"plans",6:"quotes",8:"apptReq",9:"won",10:"lost"};
const ACT=[["call","Call"],["wa","WhatsApp"],["pv","Patient visit"],["sv","Sales visit"],["gp","Group post"],["ag","Agent communication"],["bm","B2B meeting"],["bl","B2B lead"],["rl","Reel"],["sp","Social post"]];
const REASONS=["Price too high","Chose another country","Chose another hospital","Not financially ready","Stopped responding","Family decision","Visa / travel issue","Treatment not available","Other"];
const TG=[["calls","Calls","r"],["coldCalls","Cold Calls","r"],["appt","Confirmed Appointments","m"],["fu","Follow-ups","t"],["visits","Visits","t"],["gp","B2B Posts","t"],["ag","Agent Communications","t"],["rl","Reels","t"]];
const SC={r:"per sales rep / day",t:"team / day",m:"team / month"};
const COL=["#d92b31","#4d545c","#9aa1a9","#8f1d22","#c27a0e","#0f7f6c"];
const $=s=>document.querySelector(s),esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"),D0=s=>new Date(s+"T00:00:00");
const today=()=>iso(new Date()),plus=(n,s)=>{const d=s?D0(s):new Date();d.setDate(d.getDate()+n);return iso(d)};
const fmt=s=>s?D0(s).toLocaleDateString("en-GB",{day:"numeric",month:"short"}):"",fmtY=s=>D0(s).toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"});
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const DEF=()=>({leads:[],cold:[],corp:[],agents:[],tasks:[],meets:[],acts:[],team:[{id:"u1",name:"Me",role:"Admin"}],set:{country:"Malaysia",hospital:"Sunway Medical Centre",me:"u1",tgt:{calls:30,coldCalls:10,appt:60,fu:30,visits:6,gp:10,ag:20,rl:2,v:3}}});
let D=DEF(),view="today",sf="open",P={p:"d",d:today(),rep:""};
try{const s=localStorage.getItem("sunway_lite2"),o=localStorage.getItem("sunway_lite");if(s)D=Object.assign(DEF(),JSON.parse(s));else if(o){const mp=[0,1,4,6,7,9,10];D.leads=JSON.parse(o).map(l=>({...l,stage:mp[l.stage]??0,rep:"u1",created:l.created||today()}))}}catch(e){}
D.set.tgt=Object.assign({},DEF().set.tgt,D.set.tgt);if(D.set.tgt.v!=3){Object.assign(D.set.tgt,{calls:30,coldCalls:10,appt:60,v:3});try{localStorage.setItem("sunway_lite2",JSON.stringify(D))}catch(e){}}
function save(){try{localStorage.setItem("sunway_lite2",JSON.stringify(D))}catch(e){toast("Can’t save here – download a backup")}}
function toast(t){const e=$("#toast");e.textContent=t;e.style.display="block";clearTimeout(window._t);window._t=setTimeout(()=>e.style.display="none",2600)}
const me=()=>D.set.me,rn=id=>(D.team.find(t=>t.id==id)||{}).name||"",get=id=>D.leads.find(x=>x.id==id);
const log=(t,rep,lid,x)=>D.acts.push({d:today(),ts:new Date().toISOString(),rep:rep||me(),t,lid,...x});
const nt=t=>t=="in"||t=="out"?"call":t; // legacy inbound/outbound/cold-call records count as Call

function leadsV(){const q=$("#q").value.toLowerCase().trim();let r=D.leads.filter(l=>sf=="open"?act(l):sf=="all"||l.stage==+sf);if(q)r=D.leads.filter(l=>[l.name,l.phone,l.country,l.hospital,l.partner,l.specialty,l.treatment,l.source].join(" ").toLowerCase().includes(q));
return `<p>${tools("leads")}</p><div class="chips">${[["open","Active"],...ST.map((s,i)=>[i,s[0]]),["all","All"]].map(([k,n])=>`<button class="s ${sf==k?"on":""}" onclick="sf='${k}';render()">${n}${typeof k=="number"?" "+D.leads.filter(l=>l.stage==k).length:""}</button>`).join("")}</div>`+(r.map(l=>card(l,l.stage!=LOST)).join("")||`<p class="mu">No leads found.</p>`)}
function finV(){const W=D.leads.filter(l=>l.stage==WON),c=(k,v)=>W.filter(l=>l[k]==v).length;
const s=(l,k,o)=>`<select onchange="setF('${l.id}','${k}',this.value)" aria-label="${k}">${o.map(x=>`<option ${l[k]==x?"selected":""}>${x}</option>`).join("")}</select>`;
return `<p class="mu">Confirmed appointments / closed-won leads only. Status tracking, no amounts.</p><div class="kp"><div class="card"><b>${W.length}</b><span class="mu">Confirmed</span></div><div class="card"><b>${c("recv","Pending")+c("recv","Invoiced")}</b><span class="mu">Receivable open</span></div><div class="card"><b>${c("recv","Received")}</b><span class="mu">Received</span></div><div class="card"><b>${c("pay","Pending")}</b><span class="mu">Payable to agents</span></div></div>
<h2>Receivable (from hospital) &amp; payable (to B2B agent)</h2><div class="card" style="overflow-x:auto"><table><tr><th>Patient</th><th>Appt</th><th>Receivable</th><th>Agent</th><th>Payable</th></tr>${W.map(l=>`<tr><td><a href="#" onclick="openLead('${l.id}');return false">${esc(l.name)}</a></td><td>${fmt(l.apptDate)||"—"}</td><td>${s(l,"recv",["Pending","Invoiced","Received"])}</td><td>${esc(l.partner)||"—"}</td><td>${l.partner?s(l,"pay",["Pending","Paid"]):"—"}</td></tr>`).join("")||`<tr><td colspan=5 class="mu">No confirmed leads yet.</td></tr>`}</table></div>`}
function perfV(){const[a,b]=rng(P.p,P.d),m=met(a,b,P.rep),ds=days(a,b),n=ds.length,series=k=>ds.map(d=>k=="nl"?met(d,d,P.rep).nl:met(d,d,P.rep)[k]),lb=ds.map(fmt),txt=repText(P.p,P.d,P.rep);
return `<div class="chips" style="align-items:center">${[["d","Daily"],["w","Weekly"],["m","Monthly"]].map(([k,l])=>`<button class="s ${P.p==k?"on":""}" onclick="P.p='${k}';render()">${l}</button>`).join("")}<input type="date" value="${P.d}" onchange="P.d=this.value||today();render()"><select onchange="P.rep=this.value;render()" aria-label="Rep"><option value="">All sales reps</option>${D.team.map(t=>`<option value="${t.id}" ${P.rep==t.id?"selected":""}>${esc(t.name)}</option>`).join("")}</select></div>
<div class="kp">${[["New leads",m.nl],["Calls",m.calls],["Cold calls",m.coldCalls],["WhatsApp",m.wa],["Follow-ups",m.fu],["Appt requests",m.apptReq],["Closed won",m.won],["Closed lost",m.lost]].map(([l,v])=>`<div class="card"><b>${v}</b><span class="mu">${l}</span></div>`).join("")}</div>
<h2>Target achievement</h2><div class="card">${TG.map(([k,l])=>{const t=target(k,a,b,P.rep),p=t?Math.min(100,Math.round(m[k]/t*100)):0;return `<div class="br"><span>${l}</span><div class="bar"><i style="width:${p}%"></i></div><b>${m[k]}/${t}</b></div>`}).join("")}</div>
<h2>Trends</h2><div class="g2"><div class="card"><span class="mu">New leads</span>${col(series("nl"),lb,0)}</div><div class="card"><span class="mu">Calls</span>${col(series("calls"),lb,1)}</div><div class="card"><span class="mu">WhatsApp</span>${col(series("wa"),lb,5)}</div><div class="card"><span class="mu">Follow-ups</span>${col(series("fu"),lb,2)}</div></div>
<h2>By team member</h2><div class="card" style="overflow-x:auto"><table><tr><th>Rep</th><th>Leads</th><th>Calls</th><th>Cold</th><th>WhatsApp</th><th>Follow-ups</th><th>Visits</th><th>Won</th></tr>${D.team.map(t=>{const x=met(a,b,t.id);return `<tr><td>${esc(t.name)}</td><td>${x.nl}</td><td>${x.calls}</td><td>${x.coldCalls}</td><td>${x.wa}</td><td>${x.fu}</td><td>${x.visits}</td><td>${x.won}</td></tr>`}).join("")}</table></div>
<h2>Report</h2><div class="card"><pre id="rt">${esc(txt)}</pre><p style="display:flex;gap:8px;margin-bottom:0"><button class="p" onclick="navigator.clipboard.writeText($('#rt').textContent).then(()=>toast('Report copied'),()=>toast('Copy failed'))">Copy</button><a target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent(txt)}"><button>Send on WhatsApp</button></a></p></div>`}
function anaV(){const L=D.leads,mo=[...Array(6)].map((_,i)=>{const d=new Date();d.setMonth(d.getMonth()-5+i,1);return iso(d).slice(0,7)}),n=L.length,w=L.filter(l=>l.stage==WON).length;
return `<div class="kp"><div class="card"><b>${n}</b><span class="mu">Total leads</span></div><div class="card"><b>${w}</b><span class="mu">Won</span></div><div class="card"><b>${n?Math.round(w/n*100):0}%</b><span class="mu">Conversion</span></div><div class="card"><b>${L.filter(l=>l.stage==LOST).length}</b><span class="mu">Lost</span></div></div>
<h2>Pipeline funnel</h2><div class="card">${hb(ST.map((s,i)=>[s[0],L.filter(l=>l.stage==i).length]))}</div>
<div class="g2"><div><h2>Contact activity</h2><div class="card">${donut([["Call",D.acts.filter(x=>nt(x.t)=="call").length],["WhatsApp",D.acts.filter(x=>x.t=="wa").length],["Follow-up",D.acts.filter(x=>x.t=="fu").length]].filter(x=>x[1]))}</div></div><div><h2>Lead sources</h2><div class="card">${donut(grp(L,"source"))}</div></div><div><h2>Countries</h2><div class="card">${donut(grp(L,"country"))}</div></div><div><h2>Specialties</h2><div class="card">${donut(grp(L,"specialty"))}</div></div><div><h2>Lost reasons</h2><div class="card">${donut(grp(L.filter(l=>l.stage==LOST),"lost"))}</div></div></div>
<div class="g2"><div><h2>New leads / month</h2><div class="card">${col(mo.map(m=>L.filter(l=>l.created.startsWith(m)).length),mo,0)}</div></div><div><h2>Won / month</h2><div class="card">${col(mo.map(m=>D.acts.filter(x=>x.t=="won"&&x.d.startsWith(m)).length),mo,1)}</div></div></div>
<h2>B2B agents (leads)</h2><div class="card">${hb(grp(L.filter(l=>l.partner),"partner"))}</div>`}
function setV(){const T=D.set.tgt;return `<h2>Defaults</h2><div class="card two"><label class="f"><span>Default country</span><input value="${esc(D.set.country)}" onchange="D.set.country=this.value;save()"></label><label class="f"><span>Default hospital</span><input value="${esc(D.set.hospital)}" onchange="D.set.hospital=this.value;save()"></label></div>
<h2>Targets (sales reps only)</h2><div class="card two">${TG.map(([k,l,sc])=>`<label class="f"><span>${l} · ${SC[sc]}</span><input type="number" min="0" value="${T[k]}" onchange="D.set.tgt['${k}']=+this.value;save()"></label>`).join("")}</div>
${gl("team")}
<h2>Data</h2><div class="card it"><button onclick="exp()">Download backup</button><button onclick="$('#imp').click()">Restore backup</button><input id="imp" type="file" accept=".json" hidden onchange="imp(this)"><button style="color:var(--rd)" onclick="if(confirm('Erase ALL data?')){D=DEF();save();render()}">Erase all</button><span class="mu">Data lives in this browser only. Back up weekly.</span></div>`}
function exp(){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(D)]));a.download="sunway-backup.json";a.click()}
function imp(i){const f=i.files[0];if(f)f.text().then(t=>{try{const d=JSON.parse(t);if(!d.leads)throw 0;if(confirm("Replace all data with this backup?")){D=Object.assign(DEF(),d);save();render()}}catch(e){toast("Not a valid backup")}})}

/* ---------- CSV / Excel import & export ---------- */
const AL={name:["name","leadname","patientname","patient","fullname","contactname"],phone:["phone","contact","contactnumber","contactno","mobile","mobilenumber","whatsapp","phonenumber","number","tel"],source:["source","leadsource"],specialty:["specialty","speciality","department"],treatment:["treatment","procedure","service","condition","disease"],country:["country"],hospital:["hospital"],partner:["agent","partner","b2bagent","b2bpartner"],cost:["estcost","cost","budget"],company:["company","organisation","organization","companyname"],notes:["notes","note","remarks","remark","comment","comments"],stage:["stage","status"],rep:["assignedto","rep","owner","salesrep"]};
const nk=h=>String(h).toLowerCase().replace(/[^a-z0-9]/g,""),tools=k=>`<span style="display:flex;gap:6px;flex-wrap:wrap"><button class="s" onclick="pick('${k}')">Import CSV / Excel</button><button class="s" onclick="expCSV('${k}')">Export CSV</button><button class="s" onclick="tpl('${k}')">Template</button></span>`;
const cell=v=>{v=String(v??"");if(/^[=@]|^[+-](?![\d\s(])/.test(v))v="'"+v;return '"'+v.replace(/"/g,'""')+'"'};
function dl(name,rows){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+rows.map(r=>r.map(cell).join(",")).join("\r\n")],{type:"text/csv"}));a.download=name;a.click()}
const LH=[["Name","name"],["Phone","phone"],["Country","country"],["Lead source","source"],["Specialty","specialty"],["Treatment","treatment"],["Hospital","hospital"],["B2B agent","partner"],["Est. cost","cost"]];
function expCSV(k){if(k=="leads")dl("sunway-leads-"+today()+".csv",[[...LH.map(x=>x[0]),"Stage","Assigned to","Next action","Due","Appointment date","Created"],...D.leads.map(l=>[...LH.map(x=>l[x[1]]),ST[l.stage][0],rn(l.rep),l.act,l.fu,l.apptDate,l.created])]);
else dl("sunway-cold-calls-"+today()+".csv",[["Name","Company","Phone","Status","Next call","Owner","Notes"],...D.cold.map(r=>[r.name,r.company,r.phone,r.status,r.next,rn(r.rep),r.notes])])}
function tpl(k){dl(k=="leads"?"lead-import-template.csv":"cold-call-import-template.csv",k=="leads"?[["Name","Phone","Country","Lead source","Specialty","Treatment","Hospital","B2B agent","Est. cost","Notes"],["Rahim Uddin","+8801700000000","Bangladesh","Facebook","Cardiology","Bypass surgery","Sunway Medical Centre","","","Wants a quote"]]:[["Name","Company","Phone","Notes"],["Karim Ahmed","ABC Traders","+8801800000000","Call after 5pm"]])}
function parseCSV(t){t=t.replace(/^\ufeff/,"");const f=t.split(/\r?\n/)[0]||"",d=[",",";","\t"].map(c=>[c,f.split(c).length]).sort((a,b)=>b[1]-a[1])[0][0],rows=[];let r=[],c="",q=false;
for(let i=0;i<t.length;i++){const ch=t[i];if(q){if(ch=='"'){if(t[i+1]=='"'){c+='"';i++}else q=false}else c+=ch}else if(ch=='"')q=true;else if(ch==d){r.push(c);c=""}else if(ch=="\n"||ch=="\r"){if(ch=="\r"&&t[i+1]=="\n")i++;r.push(c);rows.push(r);r=[];c=""}else c+=ch}
if(c!==""||r.length){r.push(c);rows.push(r)}return rows.filter(r=>r.some(x=>x.trim()))}
function mapRows(rows){if(rows.length<2)return null;const col={};rows[0].forEach((h,i)=>{const n=nk(h);for(const f in AL)if(!(f in col)&&AL[f].includes(n)){col[f]=i;break}});if(!("name" in col))return null;
return rows.slice(1).map(r=>{const o={};for(const f in col)o[f]=(r[col[f]]||"").trim();return o})}
function doImport(rows,k){const o=mapRows(rows);if(!o)return toast("No “Name” column found – download the template");
const list=k=="leads"?D.leads:D.cold,key=r=>String(r.phone||"").replace(/\D/g,"").slice(-10),seen=new Set(list.map(key).filter(Boolean));let add=[],dup=0,bad=0;
o.forEach(x=>{if(!x.name){bad++;return}const p=key(x);if(p&&seen.has(p)){dup++;return}if(p)seen.add(p);add.push(x)});
if(!add.length)return toast("Nothing to import ("+dup+" duplicates, "+bad+" without a name)");
if(!confirm("Import "+add.length+" new "+(k=="leads"?"leads":"cold-call contacts")+"?\n"+dup+" duplicates skipped, "+bad+" rows without a name ignored."))return;
const repOf=x=>(D.team.find(t=>t.name.toLowerCase()==(x.rep||"").toLowerCase())||{id:me()}).id;
add.slice().reverse().forEach(x=>{if(k=="leads"){const st=ST.findIndex(s=>s[0].toLowerCase()==(x.stage||"").toLowerCase()),l=newLead({name:x.name,phone:x.phone,country:x.country||D.set.country,source:x.source||"Import",specialty:x.specialty,treatment:x.treatment,hospital:x.hospital||D.set.hospital,partner:x.partner,cost:x.cost,stage:st>=0?st:0,rep:repOf(x)},1);if(st>0)setNext(l);note(l,"Imported from file","System");if(x.notes)note(l,x.notes,"Note")}
else{const ss=["To call","Called","Callback","Interested","Not interested","Converted"],st=ss.find(v=>v.toLowerCase()==(x.stage||"").toLowerCase());D.cold.unshift({id:uid(),name:x.name,company:x.company,phone:x.phone,status:st||"To call",next:"",rep:repOf(x),notes:x.notes})}});
save();render();toast("Imported "+add.length+(dup?" · "+dup+" duplicates skipped":""))}
let IK="leads";const pick=k=>{IK=k;$("#imf").click()};
const xl=()=>window.XLSX?Promise.resolve(window.XLSX):new Promise((ok,no)=>{const s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";s.onload=()=>ok(window.XLSX);s.onerror=no;document.head.appendChild(s)});
function readFile(inp){const f=inp.files[0];inp.value="";if(!f)return;
if(/\.xlsx?$/i.test(f.name))xl().then(X=>f.arrayBuffer().then(b=>{const w=X.read(b);doImport(parseCSV(X.utils.sheet_to_csv(w.Sheets[w.SheetNames[0]])),IK)})).catch(()=>toast("Couldn’t read the Excel file – save it as CSV and try again"));
else f.text().then(t=>doImport(parseCSV(t),IK))}

const NAV=[["today","Today"],["leads","Leads"],["cold","Cold calls"],["corp","Corporate"],["agents","B2B"],["tasks","Tasks"],["meets","Meetings"],["fin","Finance"],["perf","Performance"],["ana","Analytics"],["set","Settings"]];
const VW={today:todayV,leads:leadsV,cold:()=>gl("cold"),corp:()=>gl("corp"),agents:()=>gl("agents"),tasks:()=>gl("tasks"),meets:()=>gl("meets"),fin:finV,perf:perfV,ana:anaV,set:setV};
function render(){$("#nv").innerHTML=NAV.map(([k,l])=>`<button class="${view==k?"on":""}" onclick="view='${k}';render()">${l}</button>`).join("");
$("#me").innerHTML=D.team.map(t=>`<option value="${t.id}" ${me()==t.id?"selected":""}>${esc(t.name)}</option>`).join("");
$("#m").innerHTML=VW[view]();
[["country","country"],["specialty","specialty"],["hospital","hospital"],["source","source"],["partner","partner"]].forEach(([k,id])=>$("#dl-"+id).innerHTML=[...new Set([...D.leads.map(l=>l[k]),...(k=="partner"?D.agents.map(a=>a.name):[])].filter(Boolean))].sort().map(v=>`<option value="${esc(v)}">`).join(""))}
$("#q").addEventListener("input",()=>render());document.addEventListener("keydown",e=>{if(e.key=="Escape")exitLead()});
render();
