<style>
:root{--bg:#f6f6f7;--sf:#fff;--tx:#262b31;--mu:#5f6770;--bd:#e4e6e9;--pr:#d92b31;--pb:#fdecec;--on:#fff;--rd:#a32d2d;--rb:#fcebeb;--gn:#0f7f6c;--gb:#dcf5ee;--am:#7a4a08;--ab:#fbeed6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171b;--sf:#1d2126;--tx:#e9ebee;--mu:#9ba3ac;--bd:#2f353c;--pr:#ff6b70;--pb:#3a1517;--on:#1a0507;--rd:#f09595;--rb:#501313;--gn:#5dcaa5;--gb:#0f3a31;--am:#fac775;--ab:#412402}}
:root[data-theme="dark"]{--bg:#14171b;--sf:#1d2126;--tx:#e9ebee;--mu:#9ba3ac;--bd:#2f353c;--pr:#ff6b70;--pb:#3a1517;--on:#1a0507;--rd:#f09595;--rb:#501313;--gn:#5dcaa5;--gb:#0f3a31;--am:#fac775;--ab:#412402}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:var(--tx);background:var(--sf);border:1px solid var(--bd);border-radius:8px;padding:8px 11px;max-width:100%;box-sizing:border-box}
button{cursor:pointer}button:hover{border-color:var(--pr)}button.p{background:var(--pr);color:var(--on);border-color:var(--pr);font-weight:600}button.s{padding:4px 10px;font-size:13px}
a{color:var(--pr);text-decoration:none}:focus-visible{outline:2px solid var(--pr);outline-offset:2px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--sf);border-bottom:1px solid var(--bd);padding:8px 14px}
.logo{height:36px;background:#fff;border-radius:6px;padding:3px 6px}.dh{position:sticky;top:0;background:var(--sf);z-index:2;padding:6px 0;border-bottom:1px solid var(--bd)}.hr{display:flex;gap:8px;align-items:center;flex-wrap:wrap}header b{font-size:16px}
#nv{display:flex;gap:2px;overflow-x:auto;margin-top:6px}#nv button{border:0;background:none;color:var(--mu);font-weight:500;white-space:nowrap}#nv button.on{background:var(--pb);color:var(--pr)}
main{max-width:900px;margin:0 auto;padding:16px 14px 60px}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--mu);margin:22px 0 8px;font-weight:600}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:12px 14px;margin:8px 0}
.it{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.it .g{flex:1;min-width:160px;cursor:pointer}
.sp{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mu{color:var(--mu);font-size:13px}.tag{display:inline-block;padding:1px 9px;border-radius:10px;font-size:12px;background:var(--pb);color:var(--pr)}.tag.r{background:var(--rb);color:var(--rd)}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(115px,1fr));gap:8px}.kp .card{margin:0;text-align:center}.kp b{display:block;font-size:24px;line-height:1.2}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.chips button.on,.stg button.on{background:var(--pr);color:var(--on);border-color:var(--pr)}
.bar{height:8px;background:var(--pb);border-radius:4px}.bar i{display:block;height:100%;background:var(--pr);border-radius:4px}
.br{display:grid;grid-template-columns:130px 1fr 44px;gap:8px;align-items:center;font-size:13px;margin:5px 0}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}.g2 .card{margin:0}
.lg{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;margin-top:6px}.lg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px}
#dw{position:fixed;inset:0 0 0 auto;width:min(480px,100%);background:var(--sf);border-left:1px solid var(--bd);padding:calc(14px + env(safe-area-inset-top,0px)) 14px calc(14px + env(safe-area-inset-bottom,0px));overflow:auto;transform:translateX(105%);transition:transform .15s;z-index:9}#dw.on{transform:none}
.f{display:block;margin:8px 0}.f span{display:block;font-size:12px;color:var(--mu)}.f input:not([type=checkbox]),.f select,.f textarea{width:100%}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stg{display:flex;gap:4px;flex-wrap:wrap;margin:8px 0}
.log div{padding:6px 0;border-bottom:1px solid var(--bd);font-size:13px}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:6px;border-bottom:1px solid var(--bd)}
pre{white-space:pre-wrap;font:13px/1.55 system-ui,sans-serif;margin:0}
.tl{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:6px 10px;border:1px solid var(--bd);border-radius:10px;font-size:13px}.tl div{display:flex;gap:4px;align-items:center}
#toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:8px 14px;border-radius:8px;display:none;z-index:20}
.note{border-radius:8px;padding:8px 11px;margin:8px 0;font-size:13px;background:var(--gb);color:var(--gn)}.note.err{background:var(--rb);color:var(--rd)}.note.warn,.note.em{background:var(--ab);color:var(--am)}
@media(prefers-reduced-motion:reduce){#dw{transition:none}}
#alm{display:none;position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.55);align-items:center;justify-content:center;padding:16px}#alm.on{display:flex}#alm .bx{background:var(--bg);border:2px solid var(--pr);border-radius:14px;padding:14px;width:min(94vw,430px);max-height:86vh;overflow:auto;animation:alp 1s infinite alternate}@keyframes alp{to{box-shadow:0 0 0 6px var(--pb)}}

<p style="display:flex;gap:6px;flex-wrap:wrap;align-items:center"><input type="month" value="${cmM}" onchange="cmM=this.value;render()" aria-label="Month"><button class="s" onclick="openForm('cm')">+ Add line</button><button class="s" onclick="cmTpl()">Template</button><label class="s" style="cursor:pointer">Import Sunway Excel<input type="file" accept=".xlsx,.xls,.csv" hidden onchange="cmImport(this.files[0])"></label><button class="s p" onclick="cmBill()">Create bills for ticked</button></p>
<div class="card" style="overflow-x:auto"><table><tr><th></th><th>Month</th><th>Patient</th><th>B2B agent</th><th>Hospital bill</th><th>Sunway paid</th><th>IVF</th><th>Agent gets</th><th>Rep gets</th><th></th></tr>${L.map(c=>{const x=calc(c),can=x.ok&&((x.g&&x.A>0&&!c.ba)||(x.R>0&&!c.br));return `<tr><td><input type="checkbox" ${can?"":"disabled"} ${CSEL.has(c.id)?"checked":""} onchange="this.checked?CSEL.add('${c.id}'):CSEL.delete('${c.id}')"></td><td>${esc(c.month)}</td><td>${esc(x.pat)}${x.ok?"":` <span class="tag r" title="Edit the line and type the patient's Lead ID, passport, phone or exact name">Not linked</span>`} <span class="mu">${esc(x.no)}${c.pass?" · "+esc(c.pass):""}${c.appt?" · "+fmt(c.appt):""}</span></td><td>${esc(x.g||"—")}${x.agBad?` <span class="tag r">“${esc(c.agent)}” not found</span>`:""}</td><td>${rmf(c.bill)}</td><td>${c.recv===""||c.recv==null?"—":rmf(c.recv)}</td><td>${c.ivf?"✓":""}</td><td>${x.g?rmf(x.A)+(c.ba?" ✓":""):"—"}</td><td>${rmf(x.R)}${c.br?" ✓":""}<br><span class="mu">${esc(rn(x.rep))}</span>${x.rpBad?` <span class="tag r">“${esc(c.repn)}” not found</span>`:""}</td><td><button class="s" onclick="openForm('cm','${c.id}')">Edit</button></td></tr>`}).join("")||`<tr><td colspan=10 class="mu">No lines yet – import the Sunway Excel or add a line.</td></tr>`}</table></div>
<h2>Commission bills</h2><div class="card" style="overflow-x:auto"><table><tr><th>Bill</th><th>Payee</th><th>Total</th><th>Pay to</th><th>Status</th><th></th></tr>${D.bills.map(b=>`<tr><td>${b.no}<br><span class="mu">${fmt(b.date)}</span></td><td>${esc(b.name)}<br><span class="mu">${b.to=="agent"?"B2B agent":"Sales rep"} · ${b.lines.length} lines</span></td><td>${rmf(b.total)}${bdt(b.total)}</td><td>${esc(b.pay||"—")}<br><span class="mu">${esc(b.acct||"")}</span></td><td><span class="tag">${b.st}</span></td><td style="white-space:nowrap">${b.st!=BST[3]?`<button class="s p" onclick="bAdv('${b.id}')">${b.st==BST[0]?"CEO approved":b.st==BST[1]?"Sent to accounts":"Mark paid"}</button> `:""}<button class="s" onclick="bPrint('${b.id}')">Print</button> <button class="s" onclick="bDel('${b.id}')">Delete</button></td></tr>`).join("")||`<tr><td colspan=6 class="mu">No bills yet. Tick appointments above, then “Create bills for ticked”: one bill per agent and per sales rep, for CEO approval (Tareq Abdullah) and then accounts.</td></tr>`}</table></div>`}
function cmSettings(){const k=CM(),i=(l,key,st)=>`<label class="f"><span>${l}</span><input type="number" step="any" value="${k[key]}" onchange="cmSet('${key}',this.value)" ${st||""}></label>`;
return `<h2>Commission rules</h2><div class="card two">${i("Sales rep % of hospital bill","repPct")}${i("Default B2B agent %","agentPct")}${i("IVF fixed commission (RM)","ivf")}${i("BDT per 1 RM (set later)","bdt","placeholder=\"e.g. 27\"")}</div>`}

/* ---------- demo data ---------- */
function demoLoad(){if(D.leads.some(l=>l.demo))return toast("Demo data is already loaded");const t=today(),m=t.slice(0,7),d=new Date(Date.now()+3*6e4),hm=String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");
const rp={id:uid(),name:"Demo Rep – Rina",role:"Sales rep",phone:"01700000000",pay:"bKash",acct:"01700-000000",demo:true},g1={id:uid(),name:"Demo Agent – Dhaka Care",contact:"Mr. Karim",phone:"01711000001",pct:"",pay:"bKash",acct:"01711-000001",mou:"Signed",demo:true},g2={id:uid(),name:"Demo Agent – Sylhet Med",contact:"Ms. Shirin",phone:"01711000002",pct:"10",pay:"Bank",acct:"City Bank, A/C 1234567890",mou:"Signed",demo:true};
D.team.push(rp);D.agents.push(g1,g2);
const mk=(name,i,o)=>newLead({name:"Demo – "+name,phone:"0170000"+(1000+i),passport:"DEMO"+(100+i),rep:rp.id,demo:true,...o},1);
[["Anwar Hossain",0,"Cardiology & Chest"],["Beauty Begum",1,"Women's Health"],["Chand Mia",2,"Neurology"],["Dilruba Khan",4,"Oncology"],["Emon Sheikh",11,"Eye Centre"],["Fatema Noor",7,"Dental Care"],["Golam Rabbi",8,"ENT"]].forEach(([n,st,sp],i)=>mk(n,i+1,{stage:st,specialty:sp}));
mk("Lost Patient",9,{stage:LOST,lost:"Cost too high",specialty:"Surgery"});
const W=[["Rahim Uddin",11,"Cardiology & Chest",g1.name,-4,"",18500,2035,false],["Salma Khatun",12,"IVF",g1.name,-9,"Attended",14000,1540,true],["Nazmul Hasan",13,"Orthopaedic & Spine Care",g2.name,-12,"",32000,3520,false],["Farhana Akter",14,"IVF","",-15,"Attended",12500,1375,true],["Kamal Hossain",15,"Oncology","",-20,"Attended",26000,2860,false],["Jahid Alam",16,"Urology",g1.name,-3,"No-show",0,0,false]].map(([n,i,sp,pa,ad,oc,bill,rc,iv])=>{const l=mk(n,i,{stage:WON,specialty:sp,partner:pa,apptDate:plus(ad),outcome:oc,email:n.split(" ")[0].toLowerCase()+"@example.com",recv:"Pending",pay:pa?"Pending":"N/A"});if(bill)D.cm.push({id:uid(),demo:true,no:l.no,name:l.name,pass:l.passport,appt:l.apptDate,month:m,bill,recv:rc,ivf:iv,apct:""});return l});
const c=D.cm.filter(x=>x.demo);CSEL=new Set([c[0].id,c[1].id]);cmBill();D.bills.forEach(b=>{if(!b.demo){b.demo=true;if(b.to=="agent"){b.st=BST[1];b.hist.push(BST[1]+" – "+t)}}});
D.tasks.push({id:uid(),demo:true,title:"Demo: call Rahim Uddin – post-appointment follow-up",due:t,time:hm,remind:"At due time",alarm:true,rep:me()});
Object.entries({call:12,wa:8,em:5,fu:4,pv:1,gp:1,ag:2,bm:1,cv:1,apptReq:2,won:1,docs:1}).forEach(([k,n])=>{for(let i=0;i<n;i++)D.acts.push({d:t,ts:new Date().toISOString(),rep:rp.id,t:k,demo:true})});
save();render();toast("Demo data loaded – open Finance, Leads, Performance and Today")}
function demoClear(){if(!confirm("Remove all demo data? Your real data is not touched."))return;["leads","agents","team","tasks","acts","cm","bills"].forEach(k=>D[k]=D[k].filter(x=>!x.demo));D.leads.forEach(l=>{});CSEL.clear();save();render();toast("Demo data removed")}
const demoBlock=()=>`<h2>Demo data</h2><div class="card it"><button onclick="demoLoad()">Load demo data</button><button class="s" style="color:var(--rd)" onclick="demoClear()">Remove demo data</button><span class="mu g" style="cursor:default">Adds sample patients, 2 B2B agents, a sales rep, a Sunway statement, bills and today’s activity, all marked “Demo”. Remove it any time – your real data is not touched.</span></div>`;

/* ---------- shell ---------- */
const NAV=[["today","Today"],["leads","Leads"],["cold","Cold calls"],["corp","Corporate"],["agents","B2B"],["tasks","Tasks"],["meets","Meetings"],["fin","Finance"],["perf","Performance"],["ana","Analytics"],["set","Settings"]];
const VW={today:todayV,leads:leadsV,cold:()=>gl("cold"),corp:()=>gl("corp"),agents:()=>gl("agents"),tasks:()=>gl("tasks"),meets:()=>gl("meets"),fin:finV,perf:perfV,ana:anaV,set:setV};
function render(){$("#nv").innerHTML=NAV.map(([k,l])=>`<button class="${view==k?"on":""}" onclick="view='${k}';render()">${l}</button>`).join("");
$("#me").innerHTML=D.team.map(t=>`<option value="${t.id}" ${me()==t.id?"selected":""}>${esc(t.name)}</option>`).join("");
$("#m").innerHTML=VW[view]();
[["country","country"],["specialty","specialty"],["hospital","hospital"],["source","source"],["partner","partner"]].forEach(([k,id])=>{const ex=[...new Set([...D.leads.map(l=>l[k]),...(k=="partner"?D.agents.map(a=>a.name):[])].filter(Boolean))].sort(),all=k=="specialty"?[...DSPEC,...ex.filter(v=>!DSPEC.includes(v))]:ex;$("#dl-"+id).innerHTML=all.map(v=>`<option value="${esc(v)}">`).join("")})}
$("#q").addEventListener("input",()=>render());document.addEventListener("keydown",e=>{if(e.key=="Escape")exitLead()});
render();chkAlarms();setInterval(chkAlarms,15000);document.addEventListener("visibilitychange",()=>{if(!document.hidden)chkAlarms()});
</script></body></html>
