function imgShrink(file,cb,err){const r=new FileReader();r.onerror=()=>err("Could not read the image");r.onload=()=>{const im=new Image();im.onerror=()=>err("This file is not a valid image");im.onload=()=>{try{const M=1000,k=Math.min(1,M/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext("2d").drawImage(im,0,0,c.width,c.height);cb(c.toDataURL("image/jpeg",.72))}catch(e){String(r.result).length<300000?cb(r.result):err("Image too large to store")}};im.src=r.result};r.readAsDataURL(file)}
function dlgFile(k,inp){const f=inp.files[0],st=document.getElementById("fs_"+k);if(!f)return;if(!/^image\//.test(f.type)){st.textContent="Please choose a PNG or JPG image";return}st.textContent="Processing…";imgShrink(f,d=>{DLGF[k]=d;st.innerHTML="✓ Attached: "+esc(f.name)+" ("+Math.round(d.length*.75/1024)+" KB)"},m=>{st.textContent=m})}

function dailyTog(id){D.dailyDone=D.dailyDone||{};const k=dKey(),a=D.dailyDone[k]=D.dailyDone[k]||[],i=a.indexOf(id),x=(D.daily||[]).find(t=>t.id==id);if(i>=0)a.splice(i,1);else{a.push(id);if(x&&x.act)log(x.act=="cold"?"call":x.act,SESS.uid,"",x.act=="cold"?{cold:1}:{})}const lim=plus(-90);Object.keys(D.dailyDone).forEach(q=>{if(q.slice(0,10)<lim)delete D.dailyDone[q]});save();render()}

function dailySet(){return `<h2>Daily routine</h2><div class="card">${(D.daily||[]).map(x=>`<div class="drow"><input value="${esc(x.name)}" onchange="dlyEd('${x.id}','name',this.value)" style="flex:1;min-width:160px"><select onchange="dlyEd('${x.id}','act',this.value)" aria-label="Also count as">${actOpts(x.act)}</select><label><input type="checkbox" ${x.on!==false?"checked":""} onchange="dlyEd('${x.id}','on',this.checked)"> Active</label><button class="s" style="color:var(--rd)" onclick="dlyDel('${x.id}')" aria-label="Delete">✕</button></div>`).join("")}<button class="s" onclick="dlyAdd()">+ Add daily task</button><p class="mu">“Also count as” adds that activity to your daily performance when you press Done.</p></div>`}
